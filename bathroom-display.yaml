substitutions:
  name: bathroom-display
  friendly_name: Bathroom display

# VIEWE SmartRing 1.75" (factory SKU viewe-uedx46460-1.75): ESP32-S3R8, 16 MB flash,
# 466x466 CO5300 AMOLED on QSPI, CST816S touch. Pins per VIEWESMART/VIEWE-SMARTRING.
esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret bathroom_display_api_key

ota:
  - platform: esphome
    password: !secret bathroom_display_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: ha_time

esp32_ble_tracker:
  scan_parameters:
    active: false

bluetooth_proxy:
  active: false

spi:
  id: display_qspi
  type: quad
  clk_pin: GPIO13
  data_pins: [GPIO12, GPIO8, GPIO14, GPIO9]

i2c:
  id: touch_i2c
  sda: GPIO41
  scl:
    number: GPIO45
    ignore_strapping_warning: true
  frequency: 400kHz

display:
  - platform: mipi_spi
    id: amoled
    model: CO5300
    cs_pin: GPIO7
    reset_pin: GPIO11
    enable_pin: GPIO40
    dimensions:
      width: 466
      height: 466
      offset_width: 6
      offset_height: 0
    color_depth: 16
    # Vendor page 0x20 settings from the board's factory init; DISPON needs SLPOUT to settle first.
    init_sequence:
      - [0xFE, 0x20]
      - [0x19, 0x10]
      - [0x1C, 0xA0]
      - [0xFE, 0x00]
      - [0x11]
      - delay 200ms
    buffer_size: 100%
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: cst816
    id: touch
    interrupt_pin: GPIO42
    reset_pin:
      number: GPIO46
      ignore_strapping_warning: true
    skip_probe: true
    on_touch:
      - logger.log:
          format: "touch x=%d y=%d"
          args: [touch.x, touch.y]

lvgl:
  displays: [amoled]
  touchscreens: [touch]
  buffer_size: 100%
  bg_color: 0x000000
  pages:
    - id: bringup
      bg_color: 0x000000
      widgets:
        - arc:
            id: ring
            align: CENTER
            width: 456
            height: 456
            start_angle: 0
            end_angle: 360
            value: 100
            arc_color: 0x202020
            arc_width: 10
            indicator:
              arc_color: 0xFF0000
              arc_width: 10
            knob:
              opa: TRANSP
        - label:
            id: clock_label
            align: CENTER
            y: -40
            text_font: montserrat_48
            text_color: 0xFFFFFF
            text: "--:--"
        - label:
            align: CENTER
            y: 30
            text_font: montserrat_28
            text_color: 0x00FF00
            text: "green"
        - label:
            align: CENTER
            y: 75
            text_font: montserrat_28
            text_color: 0x0000FF
            text: "blue"
        - label:
            id: rssi_label
            align: CENTER
            y: 130
            text_font: montserrat_20
            text_color: 0x909090
            text: "phone: -"

interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: clock_label
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            return t.strftime("%H:%M:%S");

sensor:
  - platform: ble_rssi
    id: mikkel_phone_rssi
    name: Mikkel phone RSSI
    ibeacon_uuid: D6462F88-9442-42DB-9E31-BDFF598EDC25
    ibeacon_major: 100
    ibeacon_minor: 40004
    on_value:
      - lvgl.label.update:
          id: rssi_label
          text:
            format: "phone: %.0f dBm"
            args: [x]
