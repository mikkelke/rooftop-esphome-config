substitutions:
  name: bathroom-display
  friendly_name: Bathroom display
  speaker: media_player.bathroom
  wake_ms: "30000"
  # How long the display listens for a follow-up after the speaker has said the answer.
  follow_up_ms: "10000"
  vol_step: "0.04"
  # AMOLED brightness of the night face, 0x00 to 0xFF.
  night_brightness: "0x10"
  ha_url: "http://10.21.0.5:8123"
  # The build passes the short git commit with -s git_rev.
  git_rev: unknown

# VIEWE SmartRing 1.75" (factory SKU viewe-uedx46460-1.75): ESP32-S3R8, 16 MB flash,
# 466x466 CO5300 AMOLED on QSPI, CST816S touch. Pins per VIEWESMART/VIEWE-SMARTRING.
# What to show comes from sensor.bathroom_display (AppDaemon BathroomDisplay): off | someone | mikkel.
# Its night attribute is "on" in sleep mode, and the face is then only the clock and the alarm line (line1).
# The play button fires esphome.bathroom_display_play; BathroomDisplay pauses, resumes or starts the radio.
# A tap on an alarm line, in a chip or on the night face, fires esphome.bathroom_display_alarm; BathroomDisplay
# toggles the wake-up alarm.
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: mikkel.bathroom-display
    version: ${git_rev}
  includes:
    - bathroom-display/mdi_glyph.h

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

debug:
  update_interval: 60s

api:
  encryption:
    key: !secret bathroom_display_api_key

ota:
  - platform: esphome
    password: !secret bathroom_display_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Copenhagen

esp32_ble_tracker:
  scan_parameters:
    active: false

bluetooth_proxy:
  active: false

# Onboard PDM mic: clock GPIO48, data GPIO47. ESPHome takes the PDM clock on the lrclk pin.
i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: GPIO48

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic
    i2s_din_pin: GPIO47
    adc_type: external
    pdm: true
    sample_rate: 16000
    bits_per_sample: 16bit
    correct_dc_offset: true

# Wake word runs on the device; after it, Assist (HA's preferred pipeline) gets the audio
# and the spoken answer plays on the bathroom Sonos. The ring turns green while listening.
# The answer's play_media call returns when the Sonos has said it; then the display listens
# for follow_up_ms without the wake word, in the same conversation, at most 10 times per wake.
micro_wake_word:
  id: mww
  microphone: mic
  models:
    - model: alexa
  on_wake_word_detected:
    - lambda: id(follow_ups) = 0;
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:
  on_listening:
    - lambda: |-
        id(awake_until) = millis() + ${wake_ms};
        lv_obj_set_style_arc_color(id(ring), lv_color_hex(0x22C55E), LV_PART_MAIN);
    - script.execute: pick_page
  on_stt_vad_start:
    - lambda: id(heard_speech) = true;
  on_stt_vad_end:
    - lambda: lv_obj_set_style_arc_color(id(ring), lv_color_hex(0x1A1A1D), LV_PART_MAIN);
  on_tts_end:
    - binary_sensor.template.publish:
        id: answer_playing
        state: true
    - homeassistant.action:
        action: media_player.play_media
        data:
          entity_id: ${speaker}
          media_content_type: music
          announce: "true"
        data_template:
          media_content_id: "{{ url }}"
        variables:
          url: !lambda return x;
        on_error:
          - binary_sensor.template.publish:
              id: answer_playing
              state: false
        on_success:
          - binary_sensor.template.publish:
              id: answer_playing
              state: false
          - if:
              condition:
                lambda: return id(follow_ups) < 10;
              then:
                - lambda: id(follow_ups) += 1;
                - script.execute: follow_up
  on_end:
    - lambda: lv_obj_set_style_arc_color(id(ring), lv_color_hex(0x1A1A1D), LV_PART_MAIN);
    - wait_until:
        not:
          voice_assistant.is_running:
    - micro_wake_word.start:
  on_error:
    - lambda: lv_obj_set_style_arc_color(id(ring), lv_color_hex(0x1A1A1D), LV_PART_MAIN);

spi:
  id: display_qspi
  type: quad
  clk_pin: GPIO13
  data_pins: [GPIO12, GPIO8, GPIO14, GPIO9]

i2c:
  id: touch_i2c
  sda: GPIO41
  scl:
    number: GPIO45
    ignore_strapping_warning: true
  frequency: 400kHz

display:
  - platform: mipi_spi
    id: amoled
    model: CO5300
    cs_pin: GPIO7
    reset_pin: GPIO11
    enable_pin: GPIO40
    dimensions:
      width: 466
      height: 466
      offset_width: 6
      offset_height: 0
    color_depth: 16
    # Vendor page 0x20 settings from the board's factory init; DISPON needs SLPOUT to settle first.
    init_sequence:
      - [0xFE, 0x20]
      - [0x19, 0x10]
      - [0x1C, 0xA0]
      - [0xFE, 0x00]
      - [0x11]
      - delay 200ms
    buffer_size: 100%
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: cst816
    id: touch
    interrupt_pin: GPIO42
    reset_pin:
      number: GPIO46
      ignore_strapping_warning: true
    skip_probe: true
    on_touch:
      - lambda: id(awake_until) = millis() + ${wake_ms};
      - script.execute: pick_page

# On while the spoken answer plays on the speaker; AppDaemon AssistRooms never mutes then.
binary_sensor:
  - platform: template
    id: answer_playing
    name: Answer playing

globals:
  - id: follow_ups
    type: int
    initial_value: "0"
  - id: heard_speech
    type: bool
    initial_value: "false"
  - id: awake_until
    type: uint32_t
    initial_value: "0"
  - id: blank_shown
    type: bool
    initial_value: "true"
  - id: night
    type: bool
    initial_value: "false"
  # The night face is up (sleep mode); `night` above is the dimming from 23 to 06.
  - id: face_night
    type: bool
    initial_value: "false"
  - id: has_cover
    type: bool
    initial_value: "false"

http_request:
  verify_ssl: false
  timeout: 10s

image:
  - platform: online_image
    id: cover_art
    url: ${ha_url}
    format: AUTO
    type: RGB565
    resize: 96x96
    on_download_finished:
      - lambda: |-
          lv_image_set_src(id(cover), id(cover_art));
          id(has_cover) = true;
      - script.execute: paint_media
    on_error:
      - lambda: id(has_cover) = false;
      - script.execute: paint_media
  - platform: file
    defaults:
      type: RGB565
      resize: 96x96
    files:
      - {id: dr_p1, file: bathroom-display/dr/p1.png}
      - {id: dr_p2, file: bathroom-display/dr/p2.png}
      - {id: dr_p3, file: bathroom-display/dr/p3.png}
      - {id: dr_p4, file: bathroom-display/dr/p4.png}
      - {id: dr_p5, file: bathroom-display/dr/p5.png}
      - {id: dr_p6beat, file: bathroom-display/dr/p6beat.png}
      - {id: dr_p8jazz, file: bathroom-display/dr/p8jazz.png}

font:
  - file: "gfonts://Inter@300"
    id: f_clock
    size: 96
    glyphs: "0123456789:-"
  - file: "gfonts://Inter@500"
    id: f_greet
    size: 18
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@400"
    id: f_text
    size: 20
    glyphsets: [GF_Latin_Core]
    # GF_Latin_Core has no plus-minus sign, which the weighing lines use.
    glyphs: ["±"]
  - file: "gfonts://Inter@500"
    id: f_label
    size: 14
    glyphsets: [GF_Latin_Core]
    glyphs: ["±"]
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: f_icon
    size: 26
    glyphs: ["\U000F0020", "\U000F0FD7", "\U000F0068", "\U000F18E5", "\U000F10CD", "\U000F12A4", "\U000F19E6", "\U000F1835", "\U000F0A30", "\U000F0D5D", "\U000F05E1", "\U000F109F", "\U000F0AAC", "\U000F081C", "\U000F024A", "\U000F0625", "\U000F02DA", "\U000F02FD", "\U000F0319", "\U000F032A", "\U000F0FC6", "\U000F0374", "\U000F0A07", "\U000F075A", "\U000F0387", "\U000F03E4", "\U000F040A", "\U000F0415", "\U000F0439", "\U000F070D", "\U000F0473", "\U000F04AD", "\U000F04AE", "\U000F04C7", "\U000F0665", "\U000F0E66", "\U000F0502", "\U000F11FC", "\U000F052C", "\U000F0917", "\U000F19A1", "\U000F072A", "\U000F058C", "\U000F058E", "\U000F1482", "\U000F0590", "\U000F0591", "\U000F0592", "\U000F0593", "\U000F067E", "\U000F0594", "\U000F0595", "\U000F0596", "\U000F0597", "\U000F0598", "\U000F067F", "\U000F0599", "\U000F059D", "\U000F059E"]
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: f_icon_s
    size: 22
    glyphs: ["\U000F0020", "\U000F0FD7", "\U000F0068", "\U000F18E5", "\U000F10CD", "\U000F12A4", "\U000F19E6", "\U000F1835", "\U000F0A30", "\U000F0D5D", "\U000F05E1", "\U000F109F", "\U000F0AAC", "\U000F081C", "\U000F024A", "\U000F0625", "\U000F02DA", "\U000F02FD", "\U000F0319", "\U000F032A", "\U000F0FC6", "\U000F0374", "\U000F0A07", "\U000F075A", "\U000F0387", "\U000F03E4", "\U000F040A", "\U000F0415", "\U000F0439", "\U000F070D", "\U000F0473", "\U000F04AD", "\U000F04AE", "\U000F04C7", "\U000F0665", "\U000F0E66", "\U000F0502", "\U000F11FC", "\U000F052C", "\U000F0917", "\U000F19A1", "\U000F072A", "\U000F058C", "\U000F058E", "\U000F1482", "\U000F0590", "\U000F0591", "\U000F0592", "\U000F0593", "\U000F067E", "\U000F0594", "\U000F0595", "\U000F0596", "\U000F0597", "\U000F0598", "\U000F067F", "\U000F0599", "\U000F059D", "\U000F059E"]

script:
  - id: follow_up
    mode: restart
    then:
      - wait_until:
          not:
            voice_assistant.is_running:
      - micro_wake_word.stop:
      - lambda: id(heard_speech) = false;
      - voice_assistant.start:
      - delay: ${follow_up_ms}ms
      - if:
          condition:
            lambda: return !id(heard_speech);
          then:
            - voice_assistant.stop:
            - wait_until:
                not:
                  voice_assistant.is_running:
            - micro_wake_word.start:
  # The night face's brightness while it is up, else dim from 23 to 06.
  - id: apply_brightness
    then:
      - lambda: |-
          id(amoled).set_brightness(id(face_night) ? ${night_brightness} : (id(night) ? 0x30 : 0xD0));
  - id: pick_page
    then:
      - if:
          condition:
            lambda: return id(blank_shown) && (id(view).state != "off" || millis() < id(awake_until));
          then:
            - lambda: id(blank_shown) = false;
            - lvgl.page.show: main_page
      - if:
          condition:
            lambda: return !id(blank_shown) && id(view).state == "off" && millis() >= id(awake_until);
          then:
            - lambda: id(blank_shown) = true;
            - lvgl.page.show: blank_page
  - id: paint_weather
    then:
      - lambda: |-
          static const std::map<std::string, std::string> icon = {
            {"clear-night", "mdi:weather-night"}, {"cloudy", "mdi:weather-cloudy"},
            {"exceptional", "mdi:help-circle-outline"}, {"fog", "mdi:weather-fog"}, {"hail", "mdi:weather-hail"},
            {"lightning", "mdi:weather-lightning"}, {"lightning-rainy", "mdi:weather-lightning-rainy"},
            {"partlycloudy", "mdi:weather-partly-cloudy"}, {"pouring", "mdi:weather-pouring"},
            {"rainy", "mdi:weather-rainy"}, {"snowy", "mdi:weather-snowy"}, {"snowy-rainy", "mdi:weather-snowy-rainy"},
            {"sunny", "mdi:weather-sunny"}, {"windy", "mdi:weather-windy"}, {"windy-variant", "mdi:weather-windy-variant"}};
          const std::string &w = id(weather_state).state;
          auto it = icon.find(w);
          lv_label_set_text(id(weather_icon), mdi_glyph(it != icon.end() ? it->second : "").c_str());
          uint32_t tint = 0x94A3B8;
          if (w == "sunny" || w == "lightning" || w == "lightning-rainy") tint = 0xFBBF24;
          else if (w == "partlycloudy") tint = 0xFCD34D;
          else if (w == "rainy" || w == "pouring" || w == "hail") tint = 0x38BDF8;
          else if (w == "snowy" || w == "snowy-rainy") tint = 0xE0F2FE;
          else if (w == "clear-night") tint = 0xC4B5FD;
          lv_obj_set_style_text_color(id(weather_icon), lv_color_hex(tint), LV_PART_MAIN);
          char buf[16];
          if (std::isnan(id(outdoor_temp).state)) buf[0] = 0;
          else snprintf(buf, sizeof(buf), "%.0f°", id(outdoor_temp).state);
          lv_label_set_text(id(weather_text), buf);
          lv_obj_clear_flag(id(weather_icon), LV_OBJ_FLAG_HIDDEN);
  - id: show_detail
    mode: restart
    parameters:
      n: int
    then:
      - lambda: |-
          const std::string *lines[3] = {&id(line1).state, &id(line2).state, &id(line3).state};
          lv_obj_add_flag(id(weather_icon), LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(id(weather_text), lines[n]->c_str());
      - delay: 6s
      - script.execute: paint_weather
  # The alarm line toggles the alarm; any other shows its full text in place of the weather.
  - id: tap_chip
    parameters:
      n: int
    then:
      - if:
          condition:
            lambda: |-
              const std::string *glyphs[3] = {&id(icon1).state, &id(icon2).state, &id(icon3).state};
              return *glyphs[n] == "mdi:alarm";
          then:
            - homeassistant.event:
                event: esphome.bathroom_display_alarm
          else:
            - script.execute:
                id: show_detail
                n: !lambda "return n;"
  - id: paint
    then:
      - lambda: |-
          bool night_on = id(face_night);
          bool me = !night_on && id(view).state == "mikkel";
          lv_obj_set_style_arc_color(id(ring), lv_color_hex(me ? 0xFBBF24 : 0x38BDF8), LV_PART_INDICATOR);
          lv_label_set_text(id(greet_label), me ? id(greeting).state.c_str() : "");
          // The night face is the clock and the alarm line: everything else is hidden.
          lv_obj_t *day[] = {id(ring), id(weather_row), id(chip_row), id(title_label), id(artist_label), id(control_row)};
          for (lv_obj_t *o : day) {
            if (night_on) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_align(id(clock_label), LV_ALIGN_TOP_MID, 0, night_on ? 139 : 70);
          lv_obj_set_style_text_color(id(clock_label), lv_color_hex(night_on ? 0xFBBF24 : 0xFFFFFF), LV_PART_MAIN);
          if (night_on && !id(line1).state.empty()) {
            lv_label_set_text(id(night_icon), mdi_glyph(id(icon1).state).c_str());
            lv_label_set_text(id(night_label), id(line1).state.c_str());
            lv_obj_clear_flag(id(night_row), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(night_row), LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_t *chips[3] = {id(chip1), id(chip2), id(chip3)};
          lv_obj_t *bubbles[3] = {id(chip1_btn), id(chip2_btn), id(chip3_btn)};
          lv_obj_t *icons[3] = {id(chip1_icon), id(chip2_icon), id(chip3_icon)};
          lv_obj_t *labels[3] = {id(chip1_label), id(chip2_label), id(chip3_label)};
          const std::string *lines[3] = {&id(line1).state, &id(line2).state, &id(line3).state};
          const std::string *glyphs[3] = {&id(icon1).state, &id(icon2).state, &id(icon3).state};
          const std::string *dues[3] = {&id(due1).state, &id(due2).state, &id(due3).state};
          for (int i = 0; i < 3; i++) {
            if (!me || lines[i]->empty()) { lv_obj_add_flag(chips[i], LV_OBJ_FLAG_HIDDEN); continue; }
            lv_obj_clear_flag(chips[i], LV_OBJ_FLAG_HIDDEN);
            const std::string &due = *dues[i];
            bool late = due == "overdue";
            const std::string &when = late ? std::string("now") : due;
            lv_label_set_text(icons[i], mdi_glyph(*glyphs[i]).c_str());
            lv_label_set_text(labels[i], when.c_str());
            auto fg = late ? lv_color_hex(0xFB7185) : lv_color_hex(0xE4E4E7);
            lv_obj_set_style_text_color(icons[i], fg, LV_PART_MAIN);
            lv_obj_set_style_text_color(labels[i], late ? fg : lv_color_hex(0xA1A1AA), LV_PART_MAIN);
            lv_obj_set_style_bg_color(bubbles[i], late ? lv_color_hex(0x231013) : lv_color_hex(0x161618), LV_PART_MAIN);
          }
      - script.execute: paint_media
      - script.execute: pick_page
  - id: paint_media
    then:
      - lambda: |-
          bool me = id(view).state == "mikkel";
          bool playing = id(speaker_state).state == "playing";
          bool live = playing || id(speaker_state).state == "paused";
          lv_label_set_text(id(play_icon), mdi_glyph(playing ? "mdi:pause" : "mdi:play").c_str());
          if (!live) {
            // Nothing to resume: a tap starts the radio, so the button shows its logo.
            lv_obj_add_flag(id(cover), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(radio_cover), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(cover_dim), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(play_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_opa(id(play_btn), LV_OPA_TRANSP, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(play_icon), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
            return;
          }
          lv_obj_add_flag(id(radio_cover), LV_OBJ_FLAG_HIDDEN);
          if (id(has_cover)) {
            lv_obj_clear_flag(id(cover), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_opa(id(play_btn), LV_OPA_TRANSP, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(play_icon), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
            if (playing) {
              lv_obj_add_flag(id(cover_dim), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(play_icon), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(id(cover_dim), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(play_icon), LV_OBJ_FLAG_HIDDEN);
            }
          } else {
            lv_obj_add_flag(id(cover), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(cover_dim), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(play_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_opa(id(play_btn), LV_OPA_COVER, LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(play_btn), lv_color_hex(me ? 0xFBBF24 : 0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(play_icon), lv_color_hex(0x000000), LV_PART_MAIN);
          }
  - id: load_cover
    then:
      - lambda: |-
          static const std::map<std::string, image::Image *> dr = {
            {"DR P1", id(dr_p1)}, {"DR P2", id(dr_p2)}, {"DR P3", id(dr_p3)},
            {"DR P4 København", id(dr_p4)}, {"DR P5 København", id(dr_p5)},
            {"DR P6 Beat", id(dr_p6beat)}, {"DR P8 Jazz", id(dr_p8jazz)}};
          const std::string &pic = id(media_picture).state;
          auto logo = dr.find(id(media_album).state);
          id(has_cover) = false;
          if (logo != dr.end()) {
            lv_image_set_src(id(cover), logo->second);
            id(has_cover) = true;
          } else if (!pic.empty()) {
            // Spotify's 640 px cover often exceeds the 64 KB JPEG buffer; its 300 px variant does not.
            std::string url = pic;
            auto at = url.find("ab67616d0000b273");
            if (url.find("i.scdn.co/image/") != std::string::npos && at != std::string::npos)
              url.replace(at, 16, "ab67616d00001e02");
            else if (!id(media_picture_local).state.empty())
              url = std::string("${ha_url}") + id(media_picture_local).state;
            id(cover_art).set_url(url);
            id(cover_art).update();
          }
      - script.execute: paint_media
  - id: paint_title
    then:
      - lambda: |-
          auto usable = [](const std::string &v) {
            std::string l = v;
            for (auto &c : l) c = tolower(c);
            return !l.empty() && l != "no desc" && l != "unknown" && l.rfind("playlist", 0) != 0;
          };
          const std::string &state = id(speaker_state).state;
          const std::string &title = id(media_title).state, &artist = id(media_artist).state, &album = id(media_album).state;
          bool live = state == "playing" || state == "paused";
          std::string main, sub;
          if (live && usable(title)) {
            main = title;
            sub = usable(artist) ? artist : usable(album) ? album : "";
          } else if (live && usable(album)) {
            main = album;
          }
          if (sub == main) sub = "";
          lv_label_set_text(id(title_label), main.c_str());
          lv_label_set_text(id(artist_label), sub.c_str());
  - id: step_volume
    parameters:
      delta: float
    then:
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: ${speaker}
          data_template:
            volume_level: "{{ v }}"
          variables:
            v: !lambda 'return std::to_string(std::clamp(roundf((id(speaker_volume).state + delta) * 100) / 100, 0.0f, 1.0f));'

text_sensor:
  - platform: homeassistant
    id: view
    entity_id: sensor.bathroom_display
    on_value:
      - script.execute: paint
  - platform: homeassistant
