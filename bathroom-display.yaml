    on_value: [script.execute: paint]
  - platform: homeassistant
    id: due2
    entity_id: sensor.bathroom_display
    attribute: due2
    on_value: [script.execute: paint]
  - platform: homeassistant
    id: due3
    entity_id: sensor.bathroom_display
    attribute: due3
    on_value: [script.execute: paint]
  - platform: homeassistant
    id: night_face
    entity_id: sensor.bathroom_display
    attribute: night
    on_value:
      - lambda: |-
          bool on = x == "on";
          if (on == id(face_night)) return;
          id(face_night) = on;
          id(apply_brightness).execute();
      - script.execute: paint
  - platform: homeassistant
    id: weather_state
    entity_id: weather.forecast_home
    on_value: [script.execute: paint_weather]
  - platform: homeassistant
    id: speaker_state
    entity_id: ${speaker}
    on_value:
      - script.execute: paint_media
      - script.execute: paint_title
  - platform: homeassistant
    id: media_title
    entity_id: ${speaker}
    attribute: media_title
    on_value: [script.execute: paint_title]
  - platform: homeassistant
    id: media_artist
    entity_id: ${speaker}
    attribute: media_artist
    on_value: [script.execute: paint_title]
  - platform: homeassistant
    id: media_album
    entity_id: ${speaker}
    attribute: media_album_name
    on_value:
      - script.execute: paint_title
      - script.execute: load_cover
  - platform: homeassistant
    id: media_picture
    entity_id: ${speaker}
    attribute: entity_picture
    on_value: [script.execute: load_cover]
  - platform: homeassistant
    id: media_picture_local
    entity_id: ${speaker}
    attribute: entity_picture_local

sensor:
  - platform: homeassistant
    id: outdoor_temp
    entity_id: weather.forecast_home
    attribute: temperature
    on_value: [script.execute: paint_weather]
  - platform: homeassistant
    id: speaker_volume
    entity_id: ${speaker}
    attribute: volume_level
    on_value:
      - lvgl.arc.update:
          id: ring
          value: !lambda 'return std::isnan(x) ? 0 : (int) roundf(x * 100);'
  - platform: homeassistant
    id: speaker_duration
    entity_id: ${speaker}
    attribute: media_duration
  - platform: ble_rssi
    id: mikkel_phone_rssi
    name: Mikkel phone RSSI
    ibeacon_uuid: D6462F88-9442-42DB-9E31-BDFF598EDC25
    ibeacon_major: 100
    ibeacon_minor: 40004
    filters:
      - throttle_average: 2s
      - timeout: 15s
  # dBFS, not calibrated dB SPL: compare against the room's own baseline.
  - platform: sound_level
    microphone: mic
    passive: false
    measurement_duration: 10s
    peak:
      name: Sound peak
      id: sound_peak
    rms:
      name: Sound level
      id: sound_rms
  - platform: debug
    free:
      name: Heap free
    block:
      name: Heap largest block
    loop_time:
      name: Loop time
    psram:
      name: PSRAM free

interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: clock_label
          text: !lambda |-
            auto t = id(ha_time).now();
            return t.is_valid() ? t.strftime("%H:%M") : std::string("--:--");
      - script.execute: pick_page
  - interval: 60s
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) return;
          bool n = t.hour >= 23 || t.hour < 6;
          if (n == id(night)) return;
          id(night) = n;
          id(apply_brightness).execute();

lvgl:
  displays: [amoled]
  touchscreens: [touch]
  buffer_size: 100%
  bg_color: 0x000000
  default_font: f_text
  style_definitions:
    - id: bare
      bg_opa: TRANSP
      border_width: 0
      outline_width: 0
      shadow_width: 0
      pad_all: 0
    - id: ghost_button
      bg_opa: TRANSP
      border_width: 0
      shadow_width: 0
      radius: 24
      width: 56
      height: 56
    - id: bubble
      bg_color: 0x161618
      bg_opa: COVER
      border_width: 0
      shadow_width: 0
      radius: 26
      width: 52
      height: 52
      pad_all: 0
  pages:
    - id: blank_page
