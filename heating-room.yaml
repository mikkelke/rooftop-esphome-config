substitutions:
  name: heating-room
  friendly_name: Heating room

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Olimex ESP32-PoE2 (WROVER-E): LAN8720 PHY powered by GPIO12, RMII clock driven out on GPIO0.
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

logger:

api:
  encryption:
    key: !secret heating_room_api_key

ota:
  - platform: esphome
    password: !secret heating_room_ota_password

# UEXT pin 5 (GPIO33) has a 2.2 kΩ pull-up on the board, so the 1-Wire bus needs no extra resistor.
one_wire:
  - platform: gpio
    pin: GPIO33

sensor:
  - platform: dallas_temp
    address: 0xb200000050925228
    name: Floor heating supply
    update_interval: 15s
  - platform: dallas_temp
    address: 0x66000000bb9c0528
    name: Floor heating return
    update_interval: 15s
  - platform: dallas_temp
    address: 0x88000000d32ef128
    name: Zone 1 return
    update_interval: 15s
    filters:
      - offset: 4.10
  - platform: dallas_temp
    address: 0x37000000d4c02628
    name: Zone 2 return
    update_interval: 15s
    filters:
      - offset: 3.92
  - platform: dallas_temp
    address: 0x88000000d5e5e128
    name: Zone 3 return
    update_interval: 15s
    filters:
      - offset: 3.75
  - platform: dallas_temp
    address: 0x78000000d4d00128
    name: Zone 4 return
    update_interval: 15s
    filters:
      - offset: 3.91
  - platform: dallas_temp
    address: 0xf1000000d6462f28
    name: Zone 5 return
    update_interval: 15s
    filters:
      - offset: 4.00
  - platform: dallas_temp
    address: 0x83000000d3aa6328
    name: Zone 6 return
    update_interval: 15s
    filters:
      - offset: 4.14
  - platform: dallas_temp
    address: 0x13000000d6c4fd28
    name: Zone 7 return
    update_interval: 15s
    filters:
      - offset: 4.05
  - platform: dallas_temp
    address: 0x64000000d6e91028
    name: Primary supply
    update_interval: 15s
    filters:
      - offset: 3.35
  - platform: dallas_temp
    address: 0xf7000000d65e5b28
    name: Primary return
    update_interval: 15s
    filters:
      - offset: 3.40

button:
  - platform: restart
    name: Restart
