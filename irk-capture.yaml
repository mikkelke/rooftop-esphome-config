# Generic ESP32 dev board that captures phone IRKs (Identity Resolving Keys) by BLE pairing,
# for the Private BLE Device integration. Not a Bluetooth proxy; it runs only while capturing.
substitutions:
  irk_component_ref: a811901bc66bc4231ba23571238b9a6f18b30592

esphome:
  name: irk-capture
  friendly_name: IRK capture

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret irk_capture_api_key

ota:
  - platform: esphome
    password: !secret irk_capture_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: IRK capture fallback
    password: !secret irk_capture_ota_password

captive_portal:

packages:
  device:
    url: https://github.com/DerekSeaman/irk-capture
    ref: a811901bc66bc4231ba23571238b9a6f18b30592
    file: ESPHome Devices/irk-capture-base.yaml
